apiVersion: v1
kind: Namespace
metadata:
  name: ckad-warmup
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-app
  namespace: ckad-warmup
spec:
  replicas: 2
  selector:
    matchLabels:
      app: broken-app
  template:
    metadata:
      labels:
        app: broken-app
    spec:
      containers:
      - name: web
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: broken-svc
  namespace: ckad-warmup
spec:
  type: ClusterIP
  selector:
    app: broken-apps   # Intentional typo for Task 9!
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: ckad-warmup
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
